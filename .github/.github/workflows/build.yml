name: Build Jarvis APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/jarvis/assistant
          cat > settings.gradle.kts <<'EOF_JARVIS'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "Jarvis"
          include(":app")
          EOF_JARVIS
          cat > build.gradle.kts <<'EOF_JARVIS'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_JARVIS
          cat > gradle.properties <<'EOF_JARVIS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          kotlin.code.style=official
          EOF_JARVIS
          cat > app/build.gradle.kts <<'EOF_JARVIS'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jarvis.assistant"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.jarvis.assistant"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_JARVIS
          cat > app/src/main/AndroidManifest.xml <<'EOF_JARVIS'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />

              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>

              <application
                  android:label="Jarvis"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_JARVIS
          cat > app/src/main/java/com/jarvis/assistant/MainActivity.kt <<'EOF_JARVIS'
          package com.jarvis.assistant

          import android.Manifest
          import android.app.Activity
          import android.app.AlertDialog
          import android.content.ContentResolver
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.provider.AlarmClock
          import android.provider.ContactsContract
          import android.provider.Telephony
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.telephony.SmsManager
          import android.text.InputType
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Switch
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.text.DateFormat
          import java.util.Date
          import java.util.Locale

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              companion object {
                  const val MODEL = "claude-sonnet-5-5"
                  const val PERSONA = "You are J.A.R.V.I.S., a witty, composed, British-butler-style voice assistant on the user’s Android phone. Your replies are spoken aloud: answer in one to three short sentences of plain speech, with no markdown, lists, or emojis. Address the user as “sir” only occasionally. Phone actions such as alarms, timers, texts, calls and opening apps are handled by the app itself before you are asked, so if the user asks for one that you are being asked about, tell them how to phrase it, for example: set an alarm for 7 30 a m, text Mom saying I’m on my way, or open Spotify."
                  val BG: Int = Color.parseColor("#03111A")
                  val ACC: Int = Color.parseColor("#2FD3FF")
              }

              private lateinit var tts: TextToSpeech
              private var rec: SpeechRecognizer? = null
              private lateinit var statusV: TextView
              private lateinit var logV: TextView
              private lateinit var scrollV: ScrollView

              private val ui = Handler(Looper.getMainLooper())
              private val history = JSONArray()
              private val prefs by lazy { getSharedPreferences("jarvis", MODE_PRIVATE) }

              private var handsfree = false
              private var manual = false
              private var awake = false
              private var listening = false
              private var speaking = false
              private var ttsReady = false
              private var pendingSms: Triple<String, String, String>? = null // name, number, body

              // ---------- lifecycle & UI ----------

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  window.statusBarColor = BG
                  window.navigationBarColor = BG
                  buildUi()
                  tts = TextToSpeech(this, this)
                  requestPermissions(
                      arrayOf(
                          Manifest.permission.RECORD_AUDIO, Manifest.permission.SEND_SMS,
                          Manifest.permission.READ_SMS, Manifest.permission.READ_CONTACTS,
                          Manifest.permission.CALL_PHONE
                      ), 1
                  )
              }

              override fun onDestroy() {
                  rec?.destroy()
                  tts.shutdown()
                  super.onDestroy()
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(BG)
                      setPadding(dp(16), dp(40), dp(16), dp(16))
                  }
                  root.addView(TextView(this).apply {
                      text = "J.A.R.V.I.S."; setTextColor(ACC); textSize = 18f
                      letterSpacing = 0.4f; gravity = Gravity.CENTER
                  }, LinearLayout.LayoutParams(-1, -2))
                  statusV = TextView(this).apply {
                      text = "Tap the core to speak"; setTextColor(0xFF7BA3B5.toInt())
                      gravity = Gravity.CENTER; setPadding(0, dp(6), 0, dp(14))
                  }
                  root.addView(statusV, LinearLayout.LayoutParams(-1, -2))
                  val mic = Button(this).apply {
                      text = "TAP"; setTextColor(BG); textSize = 16f
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(ACC) }
                      setOnClickListener { onMic() }
                  }
                  root.addView(mic, LinearLayout.LayoutParams(dp(130), dp(130)).apply {
                      gravity = Gravity.CENTER_HORIZONTAL
                  })
                  scrollV = ScrollView(this)
                  logV = TextView(this).apply {
                      setTextColor(0xFFD6F4FF.toInt()); textSize = 15f; setPadding(0, dp(16), 0, 0)
                      append("Try: “Jarvis, set an alarm for 7:30 a.m.”, “text Mom saying I’m on my way”, “read my messages”, “open Spotify”, or just ask a question.\n\n")
                  }
                  scrollV.addView(logV)
                  root.addView(scrollV, LinearLayout.LayoutParams(-1, 0, 1f))
                  val row = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  val sw = Switch(this).apply {
                      text = "Hands-free  "; setTextColor(Color.WHITE)
                      setOnCheckedChangeListener { _, on -> setHandsfree(on) }
                  }
                  val set = Button(this).apply { text = "Settings"; setOnClickListener { settings() } }
                  row.addView(sw, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(set)
                  root.addView(row, LinearLayout.LayoutParams(-1, -2))
                  setContentView(root)
              }

              private fun setStatus(s: String) { statusV.text = s }
              private fun idle() = setStatus(if (handsfree) "Listening for “Jarvis”…" else "Tap the core to speak")
              private fun logLine(who: String, text: String) {
                  logV.append("$who: $text\n\n")
                  scrollV.post { scrollV.fullScroll(ScrollView.FOCUS_DOWN) }
              }
              private fun has(p: String) = checkSelfPermission(p) == PackageManager.PERMISSION_GRANTED

              private fun settings() {
                  val et = EditText(this).apply {
                      hint = "Anthropic API key (sk-ant-…)"
                      setText(prefs.getString("key", ""))
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  }
                  AlertDialog.Builder(this).setTitle("Settings").setView(et)
                      .setPositiveButton("Save") { _, _ ->
                          prefs.edit().putString("key", et.text.toString().trim()).apply()
                      }
                      .setNegativeButton("Cancel", null).show()
              }

              // ---------- speech out ----------

              override fun onInit(status: Int) {
                  if (status != TextToSpeech.SUCCESS) { setStatus("Text-to-speech unavailable"); return }
                  tts.language = Locale.UK
                  tts.voices?.filter { it.locale.language == "en" && it.locale.country == "GB" }?.let { gb ->
                      val pick = gb.firstOrNull { Regex("x-(gbd|gbb|rjs)").containsMatchIn(it.name) }
                          ?: gb.firstOrNull { !it.name.contains("female", true) }
                      if (pick != null) tts.voice = pick
                  }
                  tts.setPitch(0.8f)
                  tts.setSpeechRate(0.97f)
                  tts.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                      override fun onStart(id: String?) {}
                      override fun onDone(id: String?) { ui.post { afterSpeech() } }
                      @Deprecated("Deprecated in Java")
                      override fun onError(id: String?) { ui.post { afterSpeech() } }
                      override fun onStop(id: String?, interrupted: Boolean) { ui.post { speaking = false } }
                  })
                  ttsReady = true
                  say("Hello Sir.")
              }

              private fun say(text: String) { logLine("Jarvis", text); speak(text) }

              private fun speak(text: String) {
                  rec?.cancel(); listening = false
                  if (!ttsReady) { afterSpeech(); return }
                  speaking = true
                  setStatus("Speaking…")
                  tts.speak(text.replace(Regex("[*_#`~]"), ""), TextToSpeech.QUEUE_FLUSH, null, "jarvis")
              }

              private fun afterSpeech() {
                  speaking = false
                  if (handsfree || awake || pendingSms != null) ui.postDelayed({ listen() }, 250) else idle()
              }

              // ---------- speech in ----------

              private fun setHandsfree(on: Boolean) {
                  handsfree = on
                  if (on) {
                      window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      say("Hands-free engaged. Say Jarvis, followed by your request.")
                  } else {
                      window.clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                      rec?.cancel(); listening = false; awake = false; idle()
                  }
              }

              private fun onMic() {
                  if (speaking) { tts.stop(); speaking = false; idle(); return }
                  if (listening) { rec?.cancel(); listening = false; idle(); return }
                  manual = true
                  listen()
              }

              private fun listen() {
                  if (listening || speaking) return
                  if (!has(Manifest.permission.RECORD_AUDIO)) { setStatus("Microphone permission needed"); return }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) { setStatus("Speech recognition unavailable"); return }
                  if (rec == null) {
                      rec = SpeechRecognizer.createSpeechRecognizer(this)
                      rec!!.setRecognitionListener(listener)
                  }
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-US")
                  listening = true
                  setStatus(
                      when {
                          awake || pendingSms != null -> "I’m listening…"
                          handsfree && !manual -> "Listening for “Jarvis”…"
                          else -> "Listening…"
                      }
                  )
                  rec!!.startListening(i)
              }

              private val listener = object : RecognitionListener {
                  override fun onReadyForSpeech(p: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(v: Float) {}
                  override fun onBufferReceived(b: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onEvent(t: Int, b: Bundle?) {}
                  override fun onPartialResults(r: Bundle?) {
                      r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          ?.let { setStatus("“$it”") }
                  }
                  override fun onError(e: Int) {
                      listening = false; manual = false
                      if (speaking) return
                      if (handsfree || awake) ui.postDelayed({ listen() }, 600) else idle()
                  }
                  override fun onResults(r: Bundle?) {
                      listening = false
                      val t = r?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                      if (t.isNullOrBlank()) {
                          if (handsfree || awake) ui.postDelayed({ listen() }, 300) else idle()
                          return
                      }
                      heard(t)
                  }
              }

              private fun heard(raw: String) {
                  var t = raw.trim()
                  if (handsfree && !awake && !manual && pendingSms == null) {
                      val m = Regex("\\b(jarvis|travis|jervis)\\b[,.\\s]*", RegexOption.IGNORE_CASE).find(t)
                      if (m == null) { ui.postDelayed({ listen() }, 200); return }
                      t = t.substring(m.range.last + 1).trim()
                      if (t.isEmpty()) { awake = true; say("Hello Sir."); return }
                  }
                  manual = false
                  awake = false
                  handle(t)
              }

              // ---------- commands ----------

              private fun handle(t: String) {
                  logLine("You", t)
                  val tt = t.trim().trimEnd('.', '!', '?')
                  val l = tt.lowercase(Locale.getDefault())

                  pendingSms?.let { (name, num, body) ->
                      pendingSms = null
                      if (Regex("^(yes|yeah|yep|send( it)?|confirm|do it|go ahead)").containsMatchIn(l)) {
                          if (has(Manifest.permission.SEND_SMS)) { sendSms(num, body); say("Message sent to $name, sir.") }
                          else say("I lack permission to send messages, sir.")
                      } else say("Very good, sir. Message cancelled.")
                      return
                  }

                  val ic = RegexOption.IGNORE_CASE
                  val sms = Regex("^(?:send (?:a )?(?:text|message) to|text|message)\\s+(.+?)\\s+(?:saying|that says|that|say)\\s+(.+)$", ic).find(tt)
                  val call = Regex("^(?:call|phone|ring)\\s+(.+)$", ic).find(tt)
                  val open = Regex("^(?:open|launch)\\s+(.+)$", ic).find(tt)
                  val search = Regex("^(?:search(?: for)?|google)\\s+(.+)$", ic).find(tt)

                  when {
                      Regex("^(hello|hi|hey|good (morning|afternoon|evening))( there)?( jarvis)?$").matches(l) -> say("Hello Sir.")
                      Regex("^(stop|cancel|be quiet|never mind)$").matches(l) -> { tts.stop(); speaking = false; idle() }
                      Regex("what.*time|current time").containsMatchIn(l) ->
                          say("It is " + DateFormat.getTimeInstance(DateFormat.SHORT).format(Date()) + ", sir.")
                      Regex("what.*(date|day)").containsMatchIn(l) && ("today" in l || "date" in l) ->
                          say("Today is " + DateFormat.getDateInstance(DateFormat.FULL).format(Date()) + ".")
                      "alarm" in l && Regex("\\b(set|create|wake)\\b").containsMatchIn(l) -> setAlarm(l)
           
